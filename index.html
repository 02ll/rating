<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F3F3F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="트랙 레이팅">
<title>트랙 레이팅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F3F1; --ink:#1C1C1C; --sub:#77777B; --rule:#DADAD5; --well:#E6E6E1;
    --warn:#A3392B; --tint:#1C1C1C;
    --serif:"Hahmlet", Georgia, serif;
    --sans:"IBM Plex Sans KR", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink)}
  body{font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .hidden{display:none!important}
  .wrap{max-width:880px;margin:0 auto;padding:32px 20px 96px}
  .num{font-variant-numeric:tabular-nums}

  .btn{border:1px solid var(--ink);background:none;border-radius:6px;padding:9px 16px;font-weight:500;white-space:nowrap}
  .btn.solid{background:var(--ink);color:var(--paper)}
  .btn:disabled{opacity:.5;cursor:default}
  .link{background:none;border:0;padding:0;font-weight:500;color:var(--ink)}
  .link.warn{color:var(--warn)}
  .link.muted{color:var(--sub);font-weight:400}
  .link.u{text-decoration:underline;text-underline-offset:3px;font-weight:400}
  .back{display:inline-flex;align-items:center;gap:4px;color:var(--sub);margin-bottom:24px}
  .back svg{width:16px;height:16px}

  .field{width:100%;background:var(--well);border:1px solid transparent;border-radius:6px;padding:10px 12px;outline:none}
  .field:focus{background:#fff;border-color:var(--ink)}
  select.field{width:auto;padding-right:8px}
  textarea.field{resize:vertical;min-height:96px;line-height:1.6}
  label.lbl{display:block;font-size:13px;color:var(--sub);margin:16px 0 6px}

  /* 목록 */
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
  h1{font-family:var(--serif);font-weight:700;font-size:32px;line-height:1.1;margin:0;letter-spacing:-.01em}
  .count{margin:6px 0 0;color:var(--sub);font-size:14px}
  .sync{color:var(--sub);font-size:13px;margin:14px 0 0}
  .sync.err{color:var(--warn)}
  .controls{display:flex;gap:10px;margin:24px 0 28px}
  .shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:32px 20px}
  .item{background:none;border:0;padding:0;text-align:left;min-width:0}
  .cover{position:relative;aspect-ratio:1/1;width:100%;background:var(--well);border-radius:2px;overflow:hidden}
  .cover::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);border-radius:inherit;pointer-events:none}
  .cover img{display:block;width:100%;height:100%;object-fit:cover}
  .cover .ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:12px;font-family:var(--serif);font-weight:600;font-size:15px;line-height:1.3;color:#55555A;word-break:keep-all}
  .item .line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px}
  .item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .s{font-family:var(--serif);font-weight:600;font-size:16px;flex:none}
  .item .a{color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{color:var(--sub);padding:56px 0;text-align:center}

  /* 앨범 */
  .head{display:grid;grid-template-columns:240px 1fr;gap:32px;align-items:end;margin-bottom:36px}
  .head h2{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em;word-break:keep-all}
  .head .artist{margin:0;font-size:17px;font-weight:500}
  .head .year{margin:2px 0 0;color:var(--sub);font-size:14px}
  .avg{margin-top:24px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .avg b{font-family:var(--serif);font-weight:600;font-size:56px;line-height:1;color:var(--tint)}
  .avg span{color:var(--sub);font-size:13px}
  .tracks{list-style:none;margin:0;padding:0;border-bottom:1px solid var(--rule)}
  .track{display:grid;grid-template-columns:24px 1fr 30px 44px;column-gap:12px;row-gap:4px;align-items:center;padding:14px 0 12px;border-top:1px solid var(--rule)}
  .track .n{color:var(--sub);font-size:14px;text-align:right}
  .track .name{font-weight:500;word-break:break-word}
  .track .val{font-family:var(--serif);font-weight:600;font-size:20px;text-align:right}
  .track .sk{width:30px;height:28px;border:1px solid var(--rule);border-radius:5px;background:none;color:var(--sub);font-size:16px;line-height:1;padding:0}
  .track .sk.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .track .clr{grid-column:1;background:none;border:0;padding:0;color:#A5A5A8;font-size:12px;text-align:right}
  .track.eleven .val{color:var(--tint)}
  .track.eleven .val::after{content:"★";font-size:11px;vertical-align:super;margin-left:1px}
  .track.skipped .name,.track.skipped .n,.track.skipped .val{color:var(--sub)}
  .track input[type=range]{grid-column:2/5}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;margin:0;background:transparent;--fill:var(--rule)}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--fill)}
  input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--fill)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6.5px;border-radius:50%;background:var(--tint);border:0}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--tint);border:0}
  input[type=range].unrated::-webkit-slider-thumb{background:var(--paper);box-shadow:inset 0 0 0 1.5px #B4B4AF}
  input[type=range].unrated::-moz-range-thumb{background:var(--paper);box-shadow:inset 0 0 0 1.5px #B4B4AF}

  .actions{display:flex;gap:24px;margin-top:32px}

  /* 폼 */
  .form-title{font-family:var(--serif);font-weight:700;font-size:28px;margin:0 0 20px}
  .searchrow{display:flex;gap:8px}
  .msg{font-size:13px;color:var(--sub);margin:8px 0 0;min-height:1em}
  .results{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--rule)}
  .results li{border-bottom:1px solid var(--rule)}
  .results button{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;width:100%;background:none;border:0;padding:10px 0;text-align:left}
  .results img{width:52px;height:52px;object-fit:cover;border-radius:2px;background:var(--well);display:block}
  .results .rt{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .results .ra{color:var(--sub);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .results .ry{color:var(--sub);font-size:13px}
  .results button:hover .rt{text-decoration:underline;text-underline-offset:3px}
  .form-grid{display:grid;grid-template-columns:180px 1fr;gap:24px;margin-top:28px;align-items:start}
  .drop{display:block;cursor:pointer}
  .drop .cover{border:1px dashed #B9B9B4;background:none}
  .drop .cover.has{border:0}
  .drop .hint{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;text-align:center;font-size:13px;color:var(--sub);padding:12px}
  .drop .hint b{color:var(--ink);font-weight:500;font-size:14px}
  .drop.over .cover{border-color:var(--ink);background:var(--well)}
  .cover-ops{margin-top:8px;font-size:13px}
  .grid2{display:grid;grid-template-columns:1fr 96px;gap:8px}
  .grid2 > div{min-width:0}
  textarea.tl{min-height:240px}
  .form-actions{display:flex;align-items:center;gap:20px;margin-top:24px}

  /* 설정 */
  .prose{max-width:60ch}
  .prose p{margin:0 0 12px}
  .prose ol{margin:0 0 16px;padding-left:20px}
  .prose li{margin-bottom:4px}

  .modal{position:fixed;inset:0;background:rgba(28,28,28,.35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
  .modal .box{background:var(--paper);border-radius:8px;padding:22px;max-width:340px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.18)}
  .modal p{margin:0 0 20px}
  .modal .row{display:flex;justify-content:flex-end;gap:20px;align-items:center}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:13px;padding:6px 14px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}

  @media (max-width:640px){
    .wrap{padding:24px 18px 88px}
    .shelf{grid-template-columns:1fr 1fr;gap:26px 14px}
    .head{grid-template-columns:1fr;gap:20px}
    .head .cover{max-width:360px}
    .form-grid{grid-template-columns:1fr}
    .form-grid .drop{width:160px}
  }
  @media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="wrap">

  <!-- 목록 -->
  <section id="listView">
    <header class="top">
      <div>
        <h1>내 앨범</h1>
        <p class="count num" id="count"></p>
      </div>
      <button class="btn solid" id="addBtn">앨범 추가</button>
    </header>
    <p class="sync" id="syncLine"></p>
    <div class="controls">
      <input class="field" type="text" id="q" placeholder="앨범이나 아티스트 검색">
      <select class="field" id="sort" aria-label="정렬">
        <option value="recent">최근 추가</option>
        <option value="score">점수 높은 순</option>
        <option value="title">제목순</option>
      </select>
    </div>
    <div class="shelf" id="shelf"></div>
  </section>

  <!-- 앨범 -->
  <section id="albumView" class="hidden">
    <button class="link back" id="backBtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3 5 8l5 5"/></svg>목록</button>
    <div class="head">
      <div class="cover" id="aCover"></div>
      <div>
        <h2 id="aTitle"></h2>
        <p class="artist" id="aArtist"></p>
        <p class="year num" id="aYear"></p>
        <div class="avg"><b class="num" id="aAvg"></b><span class="num" id="aAvgSub"></span></div>
      </div>
    </div>
    <ol class="tracks" id="tracks"></ol>
    <label class="lbl" for="memo">메모</label>
    <textarea class="field" id="memo" placeholder="앨범 전체에 대한 감상"></textarea>
    <div class="actions">
      <button class="link" id="copyBtn">점수 복사</button>
      <button class="link" id="editBtn">정보 수정</button>
      <button class="link warn" id="delBtn">앨범 삭제</button>
    </div>
  </section>

  <!-- 추가 / 수정 -->
  <section id="formView" class="hidden">
    <button class="link back" id="cancelTop"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3 5 8l5 5"/></svg>돌아가기</button>
    <h2 class="form-title" id="formTitle">앨범 추가</h2>

    <div class="searchrow">
      <input class="field" type="search" id="sq" placeholder="앨범이나 아티스트로 검색" enterkeyhint="search">
      <button class="btn" id="sBtn">검색</button>
    </div>
    <p class="msg" id="sMsg"></p>
    <ul class="results" id="results"></ul>

    <div class="form-grid">
      <div>
        <label class="drop" id="drop">
          <div class="cover" id="fCover"></div>
          <input type="file" accept="image/*" id="fFile" class="hidden">
        </label>
        <div class="cover-ops"><button class="link muted hidden" id="coverRemove">커버 빼기</button></div>
      </div>
      <div>
        <label class="lbl" for="fTitle" style="margin-top:0">앨범</label>
        <input class="field" type="text" id="fTitle">
        <div class="grid2">
          <div><label class="lbl" for="fArtist">아티스트</label><input class="field" type="text" id="fArtist"></div>
          <div><label class="lbl" for="fYear">연도</label><input class="field num" type="number" id="fYear"></div>
        </div>
      </div>
    </div>

    <label class="lbl" for="fTracks">트랙리스트, 한 줄에 한 곡</label>
    <textarea class="field tl" id="fTracks"></textarea>

    <div class="form-actions">
      <button class="btn solid" id="saveBtn">저장</button>
      <button class="link muted" id="cancelBtn">취소</button>
    </div>
  </section>

  <!-- 동기화 설정 -->
  <section id="setView" class="hidden">
    <button class="link back" id="setBack"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3 5 8l5 5"/></svg>목록</button>
    <h2 class="form-title">동기화</h2>
    <div class="prose">
      <p>GitHub 토큰을 넣으면 점수가 내 GitHub 계정의 비밀 Gist 하나에 저장돼요. PC와 폰에 같은 토큰을 넣으면 같은 기록이 보여요.</p>
      <ol>
        <li><a href="https://github.com/settings/tokens/new?scopes=gist&description=track-rating" target="_blank" rel="noopener">토큰 만들기 페이지</a>를 열어요. gist 권한이 이미 체크돼 있어요.</li>
        <li>Expiration을 No expiration으로 두고 Generate token을 눌러요.</li>
        <li>나온 토큰을 아래에 붙여넣어요. 토큰은 이 기기에만 저장돼요.</li>
      </ol>
    </div>
    <div id="setForm">
      <div class="searchrow" style="max-width:520px">
        <input class="field" type="password" id="tokenIn" placeholder="ghp_로 시작하는 토큰" autocomplete="off">
        <button class="btn solid" id="tokenBtn">연결</button>
      </div>
    </div>
    <p class="msg" id="setMsg"></p>
    <button class="link warn hidden" id="unlinkBtn" style="margin-top:12px">이 기기에서 연결 해제</button>
  </section>
</div>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true">
  <div class="box">
    <p id="modalMsg"></p>
    <div class="row">
      <button class="link muted" id="mNo">취소</button>
      <button class="btn solid" id="mYes">삭제</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);

/* =========================================================
   데이터: localStorage에 바로 저장 + GitHub Gist로 동기화
   albums[id] = {id, title, artist, year, coverUrl|coverData, tint,
                 tracks:[{name, score?, skip?}], memo, created, updated}
   삭제는 {id, deleted:true, updated} 로 남겨서 다른 기기에도 반영
   ========================================================= */
const K = { data:'trackRating.data', token:'trackRating.token', gist:'trackRating.gist' };
const GIST_FILE = 'track-rating.json', GIST_DESC = 'track-rating data';
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); return true; } catch(e){ return false; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

let albums = {};
try { albums = (JSON.parse(ls.get(K.data) || '{}').albums) || {}; } catch(e){ albums = {}; }
let token = ls.get(K.token), gistId = ls.get(K.gist);

let current = null, editing = null, formCover = null, renderedStamp = null;

function persist(){
  if (!ls.set(K.data, JSON.stringify({v:1, albums}))) flash('이 기기 저장 공간이 부족해요');
  scheduleSync();
}
const live = () => Object.values(albums).filter(a => !a.deleted);

/* ---------- GitHub Gist ---------- */
async function gh(path, opts = {}){
  const r = await fetch('https://api.github.com' + path, Object.assign({}, opts, {
    headers: Object.assign({ Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' },
      opts.body ? {'Content-Type': 'application/json'} : {})
  }));
  if (r.status === 401) throw Object.assign(new Error('토큰이 맞지 않아요'), {auth: true});
  if (r.status === 404) throw Object.assign(new Error('Gist를 찾지 못했어요'), {missing: true});
  if (!r.ok) throw new Error('GitHub 오류 ' + r.status);
  return r.json();
}
async function findOrCreateGist(){
  for (let page = 1; page <= 10; page++) {
    const list = await gh('/gists?per_page=100&page=' + page);
    const hit = list.find(g => g.description === GIST_DESC && g.files && g.files[GIST_FILE]);
    if (hit) return hit.id;
    if (list.length < 100) break;
  }
  const g = await gh('/gists', { method:'POST', body: JSON.stringify({
    description: GIST_DESC, public: false,
    files: { [GIST_FILE]: { content: JSON.stringify({v:1, albums:{}}) } } }) });
  return g.id;
}
async function readRemote(){
  const g = await gh('/gists/' + gistId);
  const f = g.files && g.files[GIST_FILE];
  if (!f) return {};
  const text = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
  try { return JSON.parse(text || '{}').albums || {}; } catch(e){ return {}; }
}
function merge(a, b){
  const out = {};
  new Set([...Object.keys(a), ...Object.keys(b)]).forEach(id => {
    const x = a[id], y = b[id];
    out[id] = !x ? y : !y ? x : ((y.updated || 0) > (x.updated || 0) ? y : x);
  });
  return out;
}

let syncTimer = null, syncing = false, syncAgain = false, syncState = 'idle', syncErr = '';
function scheduleSync(delay = 1200){
  if (!token || !gistId) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sync, delay);
}
async function sync(){
  if (!token || !gistId) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; setSync('busy');
  try {
    const remote = await readRemote();
    const merged = merge(albums, remote);
    const sig = o => Object.keys(o).sort().map(k => k + ':' + (o[k].updated || 0)).join('|');
    const changedLocal = sig(merged) !== sig(albums);
    const changedRemote = sig(merged) !== sig(remote);
    if (changedLocal) { albums = merged; ls.set(K.data, JSON.stringify({v:1, albums})); render(); }
    if (changedRemote) {
      await gh('/gists/' + gistId, { method:'PATCH',
        body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify({v:1, albums}) } } }) });
    }
    setSync('ok');
  } catch(e) {
    console.error(e);
    if (e.missing) { gistId = null; ls.del(K.gist); }
    setSync('err', e.message || '연결 실패');
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; scheduleSync(300); }
  }
}
function setSync(state, err){
  syncState = state; syncErr = err || '';
  const el = $('syncLine'); el.innerHTML = ''; el.classList.toggle('err', state === 'err');
  const txt = document.createElement('span');
  const link = document.createElement('button'); link.className = 'link u muted'; link.onclick = openSettings;
  if (!token) { txt.textContent = '지금은 이 기기에만 저장돼요. '; link.textContent = '동기화 설정'; }
  else if (state === 'busy') { txt.textContent = '동기화 중'; link.textContent = ''; }
  else if (state === 'err') { txt.textContent = '동기화 안 됨: ' + syncErr + '. '; link.textContent = '설정 확인'; }
  else { txt.textContent = 'GitHub에 동기화됨. '; link.textContent = '설정'; }
  el.append(txt); if (link.textContent) el.append(link);
}

/* ---------- 앨범 검색: Apple Music → Deezer → MusicBrainz 순서로 시도 ---------- */
function jsonp(url){
  return new Promise((res, rej) => {
    const cb = '__cb' + Date.now() + Math.random().toString(36).slice(2, 7);
    const s = document.createElement('script');
    const t = setTimeout(() => { done(); rej(new Error('timeout')); }, 10000);
    function done(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { done(); res(d); };
    s.onerror = () => { done(); rej(new Error('script blocked')); };
    s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(s);
  });
}
async function getJSON(url, allowJsonp){
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } catch(e) {
    if (!allowJsonp) throw e;
    return jsonp(url);
  }
}
const art = (u, size) => u ? u.replace(/\/\d+x\d+(bb)?\.(jpg|png|webp)$/i, '/' + size + 'x' + size + 'bb.jpg') : null;
const cleanTitle = t => (t || '').replace(/\s+-\s+(EP|Single)$/i, '');
const enc = encodeURIComponent;

const providers = [
  { name: 'Apple Music',
    async search(q){
      for (const c of ['KR', 'US']) {
        const d = await getJSON('https://itunes.apple.com/search?entity=album&limit=12&country=' + c + '&term=' + enc(q), true);
        if (d.results && d.results.length) return d.results.map(r => ({
          title: cleanTitle(r.collectionName), artist: r.artistName, year: (r.releaseDate || '').slice(0, 4),
          thumb: art(r.artworkUrl100, 120), cover: art(r.artworkUrl100, 600), ref: {id: r.collectionId, c} }));
      }
      return [];
    },
    async tracks(ref){
      const d = await getJSON('https://itunes.apple.com/lookup?entity=song&limit=200&country=' + ref.c + '&id=' + ref.id, true);
      return (d.results || []).filter(x => x.wrapperType === 'track')
        .sort((a, b) => (a.discNumber - b.discNumber) || (a.trackNumber - b.trackNumber)).map(x => x.trackName);
    } },
  { name: 'Deezer',
    async search(q){
      const d = await jsonp('https://api.deezer.com/search/album?output=jsonp&limit=12&q=' + enc(q));
      return (d.data || []).map(r => ({ title: r.title, artist: r.artist && r.artist.name, year: '',
        thumb: r.cover_medium, cover: r.cover_xl, ref: {id: r.id} }));
    },
    async tracks(ref, item){
      const d = await jsonp('https://api.deezer.com/album/' + ref.id + '?output=jsonp');
      if (d.release_date) item.year = d.release_date.slice(0, 4);
      return ((d.tracks && d.tracks.data) || []).map(t => t.title);
    } },
  { name: 'MusicBrainz',
    async search(q){
      const d = await getJSON('https://musicbrainz.org/ws/2/release-group/?fmt=json&limit=12&query=' + enc(q));
      return (d['release-groups'] || []).map(r => ({ title: r.title,
        artist: (r['artist-credit'] || []).map(x => x.name + (x.joinphrase || '')).join(''),
        year: (r['first-release-date'] || '').slice(0, 4),
        thumb: 'https://coverartarchive.org/release-group/' + r.id + '/front-250',
        cover: 'https://coverartarchive.org/release-group/' + r.id + '/front-500', ref: {id: r.id} }));
    },
    async tracks(ref){
      const d = await getJSON('https://musicbrainz.org/ws/2/release?fmt=json&limit=25&inc=recordings&release-group=' + ref.id);
      const rels = (d.releases || []).sort((a, b) =>
        ((b.status === 'Official') - (a.status === 'Official')) || (a.date || '9999').localeCompare(b.date || '9999'));
      const rel = rels[0]; if (!rel) return [];
      return (rel.media || []).flatMap(m => (m.tracks || []).map(t => t.title));
    } }
];

let searchSeq = 0;
async function searchAlbums(){

/* ---------- 계산 ---------- */
const isRated = t => !t.skip && typeof t.score === 'number';
const countable = a => (a.tracks || []).filter(t => !t.skip).length;
function avg(a){
  const s = (a.tracks || []).filter(isRated).map(t => t.score);
  return s.length ? s.reduce((x, y) => x + y, 0) / s.length : null;
}
const fmt = v => v == null ? '–' : (Math.round(v * 100) / 100).toFixed(2);
const fmtT = v => v % 1 ? v.toFixed(1) : String(v);
const coverSrc = a => a.coverUrl || a.coverData || null;

function fillCover(el, a, size){
  el.innerHTML = '';
  let src = coverSrc(a);
  if (src && a.coverUrl && size) src = art(src, size);
  if (src) {
    const img = document.createElement('img'); img.alt = ''; img.loading = 'lazy'; img.src = src;
    img.onerror = () => { img.remove(); addPh(); };
    el.appendChild(img);
  } else addPh();
  function addPh(){ const p = document.createElement('div'); p.className = 'ph'; p.textContent = a.title || ''; el.appendChild(p); }
}

function openAlbum(id){ current = id; renderAlbum(true); show('albumView'); }

function touch(a){ a.updated = Date.now(); renderedStamp = a.updated; persist(); }

function renderAlbum(full){
  const a = albums[current]; if (!a) return;
  if (!full && a.updated === renderedStamp) { updateAvg(); return; }
  renderedStamp = a.updated;
  const view = $('albumView');
  if (a.tint) view.style.setProperty('--tint', a.tint); else view.style.removeProperty('--tint');
  $('aTitle').textContent = a.title || '제목 없음';
  $('aArtist').textContent = a.artist || '';
  $('aYear').textContent = a.year || '';
  fillCover($('aCover'), a, 600);
  updateAvg();
  if (document.activeElement !== $('memo')) $('memo').value = a.memo || '';

  const box = $('tracks'); box.innerHTML = '';
  (a.tracks || []).forEach((t, i) => {
    const li = document.createElement('li'); li.className = 'track';
    const n = document.createElement('span'); n.className = 'n num'; n.textContent = i + 1;
    const name = document.createElement('span'); name.className = 'name'; name.textContent = t.name;
    const sk = document.createElement('button'); sk.className = 'sk'; sk.textContent = '−';
    sk.title = '인터루드나 스킷, 평균에서 빼기';
    const val = document.createElement('span'); val.className = 'val num';
    const clr = document.createElement('button'); clr.className = 'clr'; clr.textContent = '✕'; clr.title = '점수 지우기';
    const r = document.createElement('input'); r.type = 'range'; r.min = 1; r.max = 11; r.step = 1;
    r.setAttribute('aria-label', t.name + ' 점수');
    const paint = () => {
      const has = typeof t.score === 'number';
      li.classList.toggle('skipped', !!t.skip);
      li.classList.toggle('eleven', !t.skip && t.score === 11);
      sk.classList.toggle('on', !!t.skip);
      sk.setAttribute('aria-pressed', !!t.skip);
      val.textContent = t.skip ? '−' : has ? fmtT(t.score) : '';
      r.classList.toggle('hidden', !!t.skip);
      r.classList.toggle('unrated', !has);
      r.value = has ? t.score : 6;
      const pct = has ? (t.score - 1) / 10 * 100 : 0;
      r.style.setProperty('--fill', has ? `linear-gradient(to right, var(--tint) ${pct}%, var(--rule) ${pct}%)` : 'var(--rule)');
      clr.style.visibility = has && !t.skip ? 'visible' : 'hidden';
      clr.style.display = t.skip ? 'none' : '';
    };
    r.oninput = () => { t.score = parseInt(r.value, 10); paint(); updateAvg(); touch(a); };
    clr.onclick = () => { delete t.score; paint(); updateAvg(); touch(a); };
    sk.onclick = () => { if (t.skip) delete t.skip; else t.skip = true; paint(); updateAvg(); touch(a); };
    paint();
    li.append(n, name, sk, val, clr, r);
    box.appendChild(li);
  });
}
function updateAvg(){
  const a = albums[current]; if (!a) return;
  const rated = (a.tracks || []).filter(isRated).length;
  $('aAvg').textContent = fmt(avg(a));
  $('aAvgSub').textContent = countable(a) + '곡 중 ' + rated + '곡 평가';
}

/* ---------- 커버 색 뽑기 ---------- */
function drawSquare(img, size){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const s = Math.min(img.naturalWidth, img.naturalHeight);
  c.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
  return c;
}
function tintOf(img){
  const d = drawSquare(img, 24).getContext('2d').getImageData(0, 0, 24, 24).data;
  const bins = Array.from({length: 13}, () => [0, 0, 0, 0]);
  for (let i = 0; i < d.length; i += 4) {
    const [h, s, l] = rgb2hsl(d[i], d[i+1], d[i+2]);
    const c = s * (1 - Math.abs(2 * l - 1));
    const k = c < 0.12 ? 12 : Math.floor(h * 12) % 12;
    const w = k === 12 ? 0.15 : c;
    const bn = bins[k]; bn[0] += d[i] * w; bn[1] += d[i+1] * w; bn[2] += d[i+2] * w; bn[3] += w;
  }
  const top = bins.reduce((m, b) => b[3] > m[3] ? b : m);
  let [h, s, l] = rgb2hsl(top[0] / top[3], top[1] / top[3], top[2] / top[3]);
  return hsl2hex(h, Math.min(s, 0.5), Math.min(Math.max(l, 0.28), 0.38));
}
function rgb2hsl(r, g, b){
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  if (mx === mn) return [0, 0, l];
  const d = mx - mn, s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
  const h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h / 6, s, l];
}
function hsl2hex(h, s, l){
  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l);
    return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))).toString(16).padStart(2, '0'); };
  return '#' + f(0) + f(8) + f(4);
}
function tintFromUrl(url){
  return new Promise(res => {
    const img = new Image(); img.crossOrigin = 'anonymous';
    const t = setTimeout(() => res(null), 8000);
    img.onload = () => { clearTimeout(t); try { res(tintOf(img)); } catch(e){ res(null); } };
    img.onerror = () => { clearTimeout(t); res(null); };
    img.src = art(url, 100) || url;
  });
}
async function takeFile(file){
  if (!file || !/^image\//.test(file.type)) return;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    formCover = { data: drawSquare(img, 400).toDataURL('image/jpeg', 0.8), tint: tintOf(img) };
    paintFormCover();
  } catch(e){ flash('이미지를 읽지 못했어요'); }
  URL.revokeObjectURL(url);
}

/* ---------- 폼 ---------- */
function paintFormCover(){
  const el = $('fCover'); el.innerHTML = '';
  const a = editing ? albums[editing] : null;
  const src = formCover === 'remove' ? null : formCover ? (formCover.url || formCover.data) : (a && coverSrc(a));
  el.classList.toggle('has', !!src);
  if (src) { const img = document.createElement('img'); img.alt = ''; img.src = src; el.appendChild(img); }
  else {
    const h = document.createElement('div'); h.className = 'hint';
    const b = document.createElement('b'); b.textContent = '커버 선택';
    const s = document.createElement('span'); s.textContent = '검색하면 자동으로 들어가요';
    h.append(b, s); el.appendChild(h);
  }
  $('coverRemove').classList.toggle('hidden', !src);
}
function openForm(id){
  editing = id; formCover = null;
  const a = id ? albums[id] : null;
  $('formTitle').textContent = a ? '앨범 수정' : '앨범 추가';
  $('sq').value = a ? [a.artist, a.title].filter(Boolean).join(' ') : '';
  $('sMsg').textContent = ''; $('results').innerHTML = '';
  $('fTitle').value = a ? a.title || '' : '';
  $('fArtist').value = a ? a.artist || '' : '';
  $('fYear').value = a && a.year ? a.year : '';
  $('fTracks').value = a ? (a.tracks || []).map(t => t.name).join('\n') : '';
  paintFormCover();
  show('formView');
  if (!a) $('sq').focus();
}
function closeForm(){ if (editing && albums[editing]) openAlbum(editing); else { show('listView'); renderList(); } }

function parseTracks(text){
  return text.split('\n').map(l => l.trim()
    .replace(/^\d{1,3}\s*[.)\-:]\s*/, '')
    .replace(/\s+\d{1,2}:\d{2}$/, '')
    .trim()).filter(Boolean);
}
async function saveForm(){
  const title = $('fTitle').value.trim();
  if (!title) { $('fTitle').focus(); flash('앨범 제목을 입력해요'); return; }
  const btn = $('saveBtn'); btn.disabled = true; btn.textContent = '저장 중';
  try {
    const names = parseTracks($('fTracks').value);
    const year = parseInt($('fYear').value, 10);
    let a;
    if (editing && albums[editing]) {
      a = albums[editing];
      const old = {}; (a.tracks || []).forEach(t => { if (!(t.name in old)) old[t.name] = t; });
      a.tracks = names.map(n => old[n] || {name: n});
    } else {
      const id = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      a = {id, created: Date.now(), tracks: names.map(n => ({name: n}))};
      albums[id] = a;
    }
    a.title = title;
    a.artist = $('fArtist').value.trim();
    if (year) a.year = year; else delete a.year;
    if (formCover === 'remove') { delete a.coverUrl; delete a.coverData; delete a.tint; }
    else if (formCover && formCover.url) { a.coverUrl = formCover.url; delete a.coverData; a.tint = await tintFromUrl(formCover.url) || undefined; if (!a.tint) delete a.tint; }
    else if (formCover && formCover.data) { a.coverData = formCover.data; delete a.coverUrl; a.tint = formCover.tint; }
    touch(a);
    editing = a.id;
    openAlbum(a.id);
    renderList();
    flash('저장됨');
  } finally { btn.disabled = false; btn.textContent = '저장'; }
}

function scoreText(a){
  const head = (a.title || '') + (a.artist ? ' - ' + a.artist : '') + (a.year ? ' (' + a.year + ')' : '');
  const lines = (a.tracks || []).map((t, i) =>
    (i + 1) + '. ' + t.name + ' - ' + (t.skip ? '-' : typeof t.score === 'number' ? fmtT(t.score) : 'Unrated'));
  return [head, '', ...lines, '', 'Average: ' + fmt(avg(a))].join('\n');
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false; try { ok = document.execCommand('copy'); } catch(_){}
    ta.remove(); return ok;
  }
}

const drop = $('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');

document.addEventListener('paste', e => {
  if ($('formView').classList.contains('hidden')) return;
  const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/'));
  if (f) { e.preventDefault(); takeFile(f); }
});
$('setBack').onclick = () => { show('listView'); renderList(); };
$('tokenBtn').onclick = connect;
$('tokenIn').onkeydown = e => { if (e.key === 'Enter') connect(); };
$('unlinkBtn').onclick = () => {
  ls.del(K.token); ls.del(K.gist); token = null; gistId = null;
  $('unlinkBtn').classList.add('hidden'); $('setMsg').textContent = '연결을 해제했어요. 이 기기의 기록은 남아 있어요.';
  setSync('idle');
};
// 다른 기기에서 바꾼 내용: 앱으로 돌아올 때마다 가져옴
document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleSync(200); });

setSync('idle');
renderList();
ensureGist().then(() => scheduleSync(0));
</script>
</body>
</html>
